name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      # Block vulnerable deployed dependencies without forcing an untested Tailwind 4 migration.
      # Full audits remain visible; fix remaining development dependencies separately.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        shell: bash
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::Full npm audit still reports development-tool vulnerabilities. Production audit remains enforced; follow up on Tailwind CSS 3 and Vitest."
          fi
      - run: npm --workspace apps/web exec -- playwright install --with-deps chromium
      - run: npm --workspace apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results/
