name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      - name: Test dependency audit exception policy
        run: node --test scripts/check-npm-audit.test.mjs
      - name: Audit all dependencies with bounded upstream exception
        run: node scripts/check-npm-audit.mjs
      - name: Install browser with bounded timeout
        run: timeout 240s npm --workspace apps/web exec -- playwright install --with-deps chromium
      - run: npm --workspace apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results/
