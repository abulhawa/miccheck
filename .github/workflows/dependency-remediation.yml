name: Temporary dependency remediation

on:
  push:
    branches:
      - fix/ci-security-audit-20261023
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Use repository-declared npm version
        run: npm install -g npm@11.8.0
      - name: Upgrade security-sensitive Next.js packages
        run: npm install --workspace apps/web next@16.4.2 --save-exact --no-audit --no-fund
      - name: Refresh compatible dependency versions
        shell: bash
        run: |
          npm audit fix --no-fund || true
      - name: Record remaining dependency advisories
        shell: bash
        run: |
          npm audit --audit-level=high || true
          npm audit --json > audit-remediation.json || true
      - name: Commit regenerated dependency manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch Next.js and nonbreaking vulnerable dependencies"
            git push origin HEAD:fix/ci-security-audit-20261023
          fi
      - name: Verify dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test
          npm run lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-dependency-audit
          path: audit-remediation.json
          if-no-files-found: ignore
