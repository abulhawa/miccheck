name: Temporary full dependency remediation

on:
  push:
    branches:
      - fix/full-dev-dependency-audit-20261023
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Match project npm
        run: npm install -g npm@11.8.0
      - name: Migrate Tailwind and Vitest to patched major-compatible versions
        shell: bash
        run: |
          npm install -D -w apps/web tailwindcss@4 @tailwindcss/postcss@4 vitest@4 --no-audit --no-fund
          npm uninstall -D -w apps/web autoprefixer --no-audit --no-fund
          npm install -D vitest@4 @vitest/coverage-v8@4 --no-audit --no-fund
          npm audit fix --no-fund || true
      - name: Record full audit
        shell: bash
        run: |
          npm audit --audit-level=high || true
          npm audit --json > audit-full.json || true
      - name: Commit regenerated package manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json apps/web/package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): upgrade Tailwind and Vitest to patched versions"
            git push origin HEAD:fix/full-dev-dependency-audit-20261023
          fi
      - name: Validate install, build, tests, lint, and full audit
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test
          npm run lint
          npm audit --audit-level=high
      - name: Upload full audit details
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-dependency-audit
          path: audit-full.json
          if-no-files-found: ignore
